name: Preview bundle (temporary)
on:
  push: { branches: ["cursor/count-all-registered-users-5040"] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run build:min
      - env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p preview && cp index.html app.js manifest.webmanifest service-worker.js pwa-icon.svg maskable-icon.svg preview/
          cd preview && git init -q && git checkout -qb cursor/portal-preview-bundle-5040
          git config user.name "ga[bot]"; git config user.email "ga[bot]@users.noreply.github.com"
          git add . && git commit -qm "preview ${{ github.sha }}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" cursor/portal-preview-bundle-5040
