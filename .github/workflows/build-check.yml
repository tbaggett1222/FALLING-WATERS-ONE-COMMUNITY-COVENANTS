name: Build check

on:
  pull_request:
  push:
    branches:
      - "cursor/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (undefined refs, duplicate/redeclared identifiers)
        run: npx --yes eslint@8 "falling-waters-portal.jsx" "site-entry.jsx" "server/**/*.js"

      - name: Server syntax check
        run: |
          node --check server/index.js
          node --check server/repository.js
          node --check server/db.js
          node --check server/gzipJsonMiddleware.js

      - name: Build static bundle
        run: npm run build:min

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: |
            index.html
            app.js
            manifest.webmanifest
            service-worker.js
            pwa-icon.svg
            maskable-icon.svg
          if-no-files-found: error
