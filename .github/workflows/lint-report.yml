name: Lint report (temporary)

# Temporary helper: runs ESLint and force-pushes the report to a branch so it
# can be fetched over git (CI log/artifact downloads are not reachable here).
# Safe to delete once the lint sweep is complete.

on:
  push:
    branches:
      - "cursor/ci-lint-latent-bug-sweep-5040"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run ESLint and capture report
        run: |
          set +e
          npx --yes eslint@8 "falling-waters-portal.jsx" "site-entry.jsx" "server/**/*.js" -f stylish > eslint-report.txt 2>&1
          echo "ESLINT_EXIT=$?" >> eslint-report.txt

      - name: Publish report to branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p report
          cp eslint-report.txt report/
          cd report
          git init -q
          git checkout -qb cursor/portal-lint-report-5040
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "ESLint report from ${{ github.sha }}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" cursor/portal-lint-report-5040
