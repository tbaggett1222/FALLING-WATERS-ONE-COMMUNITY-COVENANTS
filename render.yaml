services:
  - type: web
    name: falling-waters-postgres-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/db/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PGSSLMODE
        value: require
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ALERT_MAX_SYNC_AGE_MINUTES
        value: "1440"
      - key: ALERT_MIN_STATE_KEYS
        value: "1"
      - key: ALERT_MIN_SCOPE_RECORDS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: falling-waters-postgres
          property: connectionString

databases:
  - name: falling-waters-postgres
    plan: free
    databaseName: falling_waters_portal
    user: falling_waters_user
